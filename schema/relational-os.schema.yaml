# =============================================================================
# RELATIONALOS — Core Object Schema (machine-validatable)
# Version: 0.17  (Sprint 0, sub-sprint 0.1)
# Representation: JSON Schema draft 2020-12, authored in YAML.
#   YAML anchors/merge keys are authoring convenience (§C); resolved before
#   validation. Source of truth per Appendix G.11 (no tool drift).
# Derived from SPEC.md §2 / §3 / §3.16-3.19 / §7J / §7K / Appendix C / Appendix F.
# =============================================================================
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://relational-os.dev/schema/0.17/core.schema.json"
title: "RelationalOS Core Object Schema"
description: >
  Machine-validatable schema for every §3 primitive, the §7J business-operating
  objects (Case, Goal, Metric, Task, Dependency + derived Exception/Priority),
  and the §7K structural operating semantics. Appendix C URI conventions are
  enforced via the x-uri-catalog below and the companion conformance validator.

# -----------------------------------------------------------------------------
# Appendix C URI catalog (conventions: three kinds — identity / relationship /
# domain-object; additive-only, never reclassify; collision rule by first path
# segment). Consumed by conformance.py to classify + validate instances.
# -----------------------------------------------------------------------------
